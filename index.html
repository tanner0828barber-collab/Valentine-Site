<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanner ♥ Lauren</title>

<style>
:root{
  --bg:#ffeaf2;
  --card:#ffffff;
  --accent:#ff5fa2;
  --soft:#ffd1e3;
  --text:#2b1b22;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(180deg, #fff0f6, #ffe1ee);
}

.card{
  background:white;
  border-radius:20px;
  padding:22px;
  width:90%;
  max-width:420px;
  text-align:center;
  box-shadow:0 20px 40px rgba(255,95,162,.25);
}

h1{
  margin:0;
  color:#ff5fa2;
}

p{
  color:#555;
}

.carousel{
  width:100%;
  height:260px;
  border-radius:16px;
  overflow:hidden;
  margin:16px 0;
  position:relative;
}

.slide{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  opacity:0;
  transition:.5s;
}

.slide.show{
  opacity:1;
}

button{
  border:none;
  border-radius:12px;
  padding:12px 18px;
  font-size:16px;
  cursor:pointer;
}

#yes{
  background:#ff5fa2;
  color:white;
  margin-right:10px;
}

#no{
  background:#ffd1e3;
}

#msg{
  margin-top:14px;
  font-weight:bold;
  color:#ff5fa2;
}
</style>
</head>

<body>

<div class="card">
  <h1>Lauren…</h1>
  <p>I have a very serious question 💗</p>

  <div class="carousel" id="carousel"></div>

  <p><b>Will you be my Valentine?</b></p>

  <div>
    <button id="yes">YES 💘</button>
    <button id="no">No</button>
  </div>

  <div id="msg"></div>
</div>

<script>
const photos = ["photo1.jpg","photo2.jpg","photo3.jpg","photo4.jpg","photo5.jpg"];
const carousel = document.getElementById("carousel");
let index = 0;

photos.forEach((src,i)=>{
  const d = document.createElement("div");
  d.className = "slide" + (i===0 ? " show":"");
  d.style.backgroundImage = `url(${src})`;
  carousel.appendChild(d);
});

const slides = document.querySelectorAll(".slide");

setInterval(()=>{
  slides[index].classList.remove("show");
  index = (index+1)%slides.length;
  slides[index].classList.add("show");
},3000);

const no = document.getElementById("no");
no.addEventListener("mouseenter",()=>{
  no.style.position="relative";
  no.style.left = (Math.random()*140-70)+"px";
});

const yes = document.getElementById("yes");
const msg = document.getElementById("msg");
yes.addEventListener("click",()=>{
  msg.innerText="LETS GOO 😭💗 You’re my Valentine.";
});
</script>

</body>
</html>
